name: Cloud-Native Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'
      - name: Format Terraform
        working-directory: infrastructure/terraform
        run: terraform fmt -recursive
      - name: Initialize Terraform without backend
        working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - name: Validate Terraform
        working-directory: infrastructure/terraform
        run: terraform validate

  helm-validate:
    name: Helm validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint Helm chart
        run: helm lint ./helm/app

  application-test:
    name: Application lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Detect application sources
        id: detect
        shell: bash
        run: |
          python_count=$(find . -type f -name '*.py' -not -path './.git/*' | wc -l | tr -d ' ')
          test_count=0
          if [ -d tests ]; then
            test_count=$(find tests -type f -name 'test_*.py' | wc -l | tr -d ' ')
          fi
          echo "python_count=$python_count"
          echo "test_count=$test_count"
          echo "has_python=$([ "$python_count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_tests=$([ "$test_count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install Python quality tools
        if: steps.detect.outputs.has_python == 'true'
        run: python -m pip install pytest pytest-cov ruff
      - name: Compile Python sources
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: |
          mapfile -t sources < <(find . -type f -name '*.py' -not -path './.git/*')
          python -m py_compile "${sources[@]}"
      - name: Lint Python
        if: steps.detect.outputs.has_python == 'true'
        shell: bash
        run: ruff check . --exclude .git
      - name: Test Python application
        if: steps.detect.outputs.has_tests == 'true'
        run: pytest tests/ -v --cov=. --cov-report=term-missing
      - name: Report no application tests
        if: steps.detect.outputs.has_python != 'true'
        run: echo 'No Python application sources are present; infrastructure and Helm validation cover this repository.'

  docker-build:
    name: Build Docker image
    needs: [terraform-validate, helm-validate, application-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: cloud-native-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
