name: Auto-format Terraform

on:
  push:
    branches: [upgrade/infra-format-green]

permissions:
  contents: read

jobs:
  format:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.0
        with:
          terraform_version: '1.6.6'
      - name: Format Terraform
        working-directory: infrastructure/terraform
        run: terraform fmt -recursive
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Terraform is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infrastructure/terraform
          git commit -m 'style: format Terraform'
          git push