name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable Docker image tag to deploy'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment
        run: |
          test "${{ inputs.confirm }}" = "DEPLOY"
          echo "Deployment confirmed for image ${{ inputs.image_tag }}"

  deploy:
    name: Deploy to EKS
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloud-native-app-production --region ap-south-1
      - name: Deploy with Helm
        run: |
          helm upgrade --install cloud-native-app ./helm/app \
            --namespace production \
            --create-namespace \
            --set image.tag=${{ inputs.image_tag }} \
            --values helm/app/values-prod.yaml \
            --wait \
            --timeout 300s
      - name: Verify rollout
        run: kubectl rollout status deployment/cloud-native-app -n production --timeout=300s

  smoke-test:
    name: Production smoke test
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloud-native-app-production --region ap-south-1
      - name: Check application health
        run: |
          ENDPOINT=$(kubectl get ingress cloud-native-app -n production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          test -n "$ENDPOINT"
          for i in {1..10}; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://$ENDPOINT/health" || true)
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1

  rollback-on-failure:
    name: Rollback on failure
    needs: [deploy, smoke-test]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: azure/setup-kubectl@v4
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloud-native-app-production --region ap-south-1
      - name: Roll back
        run: |
          kubectl rollout undo deployment/cloud-native-app -n production
          kubectl rollout status deployment/cloud-native-app -n production --timeout=300s
