name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable Docker image tag to deploy'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        type: string

permissions:
  contents: read

# Serialize the complete production deployment lifecycle so validation,
# deployment, smoke tests, and rollback cannot overlap.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployment
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          test "$DEPLOY_CONFIRM" = "DEPLOY"
          printf 'Deployment confirmed for image %s\n' "$IMAGE_TAG"

  deploy:
    name: Deploy to EKS
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          version: latest
      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42
        with:
          version: v4.2.4
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloud-native-app-production --region ap-south-1
      - name: Deploy with Helm
        run: |
          helm upgrade --install cloud-native-app ./helm/app \
            --namespace production \
            --create-namespace \
            --set-string image.tag="$IMAGE_TAG" \
            --values helm/app/values-prod.yaml \
            --wait \
            --timeout 300s
      - name: Verify rollout
        run: kubectl rollout status deployment/cloud-native-app -n production --timeout=300s

  smoke-test:
    name: Production smoke test
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          version: latest
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloud-native-app-production --region ap-south-1
      - name: Check application health
        run: |
          ENDPOINT=$(kubectl get ingress cloud-native-app -n production -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          test -n "$ENDPOINT"
          for i in {1..10}; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://$ENDPOINT/health" || true)
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1

  rollback-on-failure:
    name: Rollback on failure
    needs: [deploy, smoke-test]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          version: latest
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloud-native-app-production --region ap-south-1
      - name: Roll back
        run: |
          kubectl rollout undo deployment/cloud-native-app -n production
          kubectl rollout status deployment/cloud-native-app -n production --timeout=300s
