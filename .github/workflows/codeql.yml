name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  detect:
    name: Detect analyzable source
    runs-on: ubuntu-latest
    outputs:
      has_python: ${{ steps.detect.outputs.has_python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect Python files
        id: detect
        shell: bash
        run: |
          count=$(find . -type f -name '*.py' -not -path './.git/*' | wc -l | tr -d ' ')
          echo "Python files: $count"
          echo "has_python=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze Python
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  no-python:
    name: CodeQL not applicable
    needs: detect
    if: needs.detect.outputs.has_python != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm no Python source
        run: echo 'No Python source is present; Python CodeQL analysis is not applicable.'
